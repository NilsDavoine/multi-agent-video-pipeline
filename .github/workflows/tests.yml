name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Fast tests only. Tests marked `example` (local speech models, headless Chrome,
      # full video rendering) are excluded by pytest.ini and run locally.
      - run: python -m pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
